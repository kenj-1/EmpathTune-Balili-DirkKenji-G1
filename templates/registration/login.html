{% extends 'base.html' %}

{% block title %}Log In | EmpathTune{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow p-4">
            <h3 class="card-title text-center mb-3">Welcome Back</h3>
            <p class="text-center text-muted small mb-4">Sign in to your EmpathTune space</p>

            {% if form.errors %}
                <div class="alert alert-danger py-2 small" role="alert">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="id_username">Username</label>
                    <input type="text" name="username" autofocus required id="id_username" class="form-control" placeholder="Enter your username">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="id_password">Password</label>
                    <input type="password" name="password" required id="id_password" class="form-control" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">Log In</button>
            </form>

            <div class="text-center mt-3 small text-muted">
                Don't have an account? <a href="{% url 'signup' %}" class="text-info text-decoration-none">Sign up here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
